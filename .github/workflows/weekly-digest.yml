name: Weekly digest

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

# All browser actions and the scheduled edition use the same durable queue and
# single writer. Replaced pending runs cannot lose queued requests.
concurrency:
  group: podcast-github-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  process:
    if: vars.PODCAST_BACKGROUND_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build the Node runner
        run: npm run build:runner
      - name: Process queued actions and the scheduled edition
        env:
          GH_TOKEN: ${{ github.token }}
          PODCAST_STATE_KEY: ${{ secrets.PODCAST_STATE_KEY }}
          PODCAST_GATEWAY_KEY: ${{ secrets.PODCAST_GATEWAY_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          MUNSHOT_EMAIL_TOKEN: ${{ secrets.MUNSHOT_EMAIL_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUMMARY_MODEL: ${{ secrets.SUMMARY_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          DEEPGRAM_MODEL: ${{ vars.DEEPGRAM_MODEL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          temp_claude_token: ${{ secrets.temp_claude_token }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          BEDROCK_REGION: ${{ vars.BEDROCK_REGION }}
          MEMBER_FEEDS: ${{ secrets.MEMBER_FEEDS }}
          EMAIL_ATTACHMENTS: ${{ vars.EMAIL_ATTACHMENTS }}
        run: node .cache/runner.mjs tick
