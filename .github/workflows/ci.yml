name: CI

# The safety net under everything else. The repo carries 330+ tests and two
# typecheck configs, but until now nothing ran them on a pull request: Cloudflare
# Pages builds each PR, and `npm run build` does typecheck the app — but the SERVER
# config and the whole test suite were never exercised before a merge. A change that
# broke the feed parsing, the roster scan or the digest assembly would go green.
#
# Everything here is what a contributor runs locally, so CI failing means the change
# is genuinely broken rather than the environment differing.

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an in-flight run for the same ref — no point finishing a
# check against code that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `ci` not `install`: fails loudly on a lockfile that has drifted from
      # package.json, rather than silently resolving something else.
      - run: npm ci

      # Both configs. The app one also runs inside `npm run build`; the server one
      # (Pages Functions + server/) is checked NOWHERE else.
      - name: Typecheck (app)
        run: npm run typecheck
      - name: Typecheck (server)
        run: npm run typecheck:server

      - name: Tests
        run: npm test

      # Proves the deployable artifact still builds — the same step Pages runs, so a
      # build break surfaces here instead of after merge.
      - name: Build
        run: npm run build
