name: Keep schedules alive
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch: {}
permissions:
  actions: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Keep scheduled processing enabled without pushing main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT repos/ceekay-munshot/podcast/actions/workflows/weekly-digest.yml/enable
